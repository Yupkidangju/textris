[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "textris-tui"
version = "1.2.1"
description = "A keyboard-driven terminal Tetris with animated text and synthesized audio"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { email = "yupkidangju@gmail.com" }
]
dependencies = ["windows-curses; sys_platform == 'win32'", "miniaudio==1.71"]

[project.optional-dependencies]
audio-production = ["mido==1.3.3", "numpy>=2.0"]

[project.scripts]
textris = "textris.__main__:main"

[tool.setuptools.packages.find]
include = ["textris*"]

[tool.setuptools.package-data]
textris = ["assets/audio/*.json", "assets/audio/*.txt", "assets/audio/music/*.ogg", "assets/audio/sfx/*.wav"]
