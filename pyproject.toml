[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "textris-tui"
version = "1.1.0"
description = "A keyboard-driven terminal Tetris with animated text and synthesized audio"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { email = "yupkidangju@gmail.com" }
]
dependencies = ["windows-curses; sys_platform == 'win32'"]

[project.scripts]
textris = "textris.__main__:main"

[tool.setuptools.packages.find]
include = ["textris*"]
